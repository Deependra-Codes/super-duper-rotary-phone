<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Deependra Rathod | Full-Stack & Systems Engineer Terminal Resume</title>
        <link rel="stylesheet" href="styles.css">
        <!-- FontAwesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- Add Google Fonts for better typography -->
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
        <!-- p5.js for Snake game -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    </head>

    <body>
        <div class="terminal">
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <span class="close"></span>
                    <span class="minimize"></span>
                    <span class="maximize"></span>
                </div>
                <div class="terminal-title">deependra@rathod: ~/resume</div>
                <div class="terminal-controls">
                    <button type="button" class="theme-selector" id="theme-toggle" aria-label="Choose terminal theme">
                        <i class="fa-solid fa-palette" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="terminal-container">
                <div class="terminal-content">
                    <div id="output"></div>
                    <div class="input-line">
                        <span class="prompt">&gt;</span>
                        <input type="text" id="command-input" aria-label="Terminal command" autofocus />
                    </div>
                </div>
            </div>
            <div class="terminal-footer">
                <a href="index.html" class="resume-link"><i class="fas fa-file-alt"></i> View Portfolio</a>
                <a href="mailto:deependrarathod898@gmail.com" class="resume-link"><i class="fas fa-envelope"></i> Email Me</a>
            </div>
            <div class="context-menu">
                <div class="menu-item" data-action="split-h">Split Horizontally</div>
                <div class="menu-item" data-action="split-v">Split Vertically</div>
                <div class="menu-item" data-action="close-split">Close Split</div>
            </div>
        </div>

        <!-- Theme Selection Modal -->
        <div id="theme-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="theme-modal-title">
            <div class="modal-content">
                <button type="button" class="close-button" aria-label="Close theme selector">&times;</button>
                <h2 id="theme-modal-title">Select Theme</h2>
                <div class="theme-options">
                    <button type="button" class="theme-option" data-theme="default">
                        <div class="theme-preview default-theme"></div>
                        <span>Default</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="dracula">
                        <div class="theme-preview dracula-theme"></div>
                        <span>Dracula</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="solarized">
                        <div class="theme-preview solarized-theme"></div>
                        <span>Solarized</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="nord">
                        <div class="theme-preview nord-theme"></div>
                        <span>Nord</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Projects Showcase Modal -->
        <div id="projects-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="projects-modal-title">
            <div class="modal-content projects-modal-content">
                <button type="button" class="close-button" aria-label="Close projects">&times;</button>
                <h2 id="projects-modal-title">Projects</h2>
                <div class="projects-container">
                    <!-- Project cards will be added here dynamically -->
                </div>
            </div>
        </div>

        <!-- Skills Visualization Modal -->
        <div id="skills-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="skills-modal-title">
            <div class="modal-content skills-modal-content">
                <button type="button" class="close-button" aria-label="Close skills visualization">&times;</button>
                <h2 id="skills-modal-title">Skills Visualization</h2>
                <div class="skills-container">
                    <!-- Skills visualization will be added here dynamically -->
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
